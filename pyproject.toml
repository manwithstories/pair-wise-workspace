[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediarail"
version = "0.1.0"
description = "Streaming timeline repair and random-access index rebuild for delivered MP4/MOV media"
requires-python = ">=3.12"
dependencies = [
    "av==12.3.*",
    "numpy==2.1.*",
    "soundfile==0.12.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mediarail = "mediarail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
