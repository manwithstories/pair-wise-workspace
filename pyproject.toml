[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audioscan"
version = "0.1.0"
description = "Streaming WAV speech segmentation and silence detection batch tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[project.scripts]
audioscan = "audioscan.cli:main"

[tool.setuptools]
packages = ["audioscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
