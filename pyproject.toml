[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relaymix"
version = "0.1.0"
description = "Offline multi-track PCM/WAV timeline rebuild and frame-sequence export"
requires-python = ">=3.12"
dependencies = [
    "av==12.3.0",
    "numpy==2.1.3",
    "soundfile==0.12.1",
]

[project.optional-dependencies]
test = ["pytest==8.3.3"]

[project.scripts]
relaymix = "relaymix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
