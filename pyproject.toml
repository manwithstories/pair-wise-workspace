[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-timeline"
version = "0.1.0"
description = "Recoverable offline timeline rebuild for regional live-distribution relays"
requires-python = ">=3.12"
dependencies = [
    "av>=12,<13",
    "numpy>=2,<3",
    "soundfile>=0.12,<0.14",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
relay-timeline = "relay_timeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
