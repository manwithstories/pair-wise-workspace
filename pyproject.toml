[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plateqc"
version = "0.1.0"
description = "Off-line QC precheck for VFX plates: decode stats, timestamp repair, timeline normalize"
requires-python = ">=3.11"
dependencies = [
    "av>=13.1",
    "numpy>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
