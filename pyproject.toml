[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archiveflow"
version = "0.1.0"
description = "RTP/RTCP archive recovery pipeline for incomplete program material"
requires-python = ">=3.12"
dependencies = [
    "av==12.3.0",
    "numpy==2.1.3",
    "soundfile==0.12.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
archiveflow = "archiveflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["archiveflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
