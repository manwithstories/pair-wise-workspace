[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reverb-cli"
version = "0.1.0"
description = "Deterministic block-FFT convolution reverb CLI with offline/streaming paths"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.scripts]
reverb = "src.reverb_cli:main"

[tool.setuptools]
packages = ["src"]
