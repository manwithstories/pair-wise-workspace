[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mediacore"
version = "0.1.0"
description = "Deterministic, resumable audio/video timeline processing for mobile clips"
requires-python = ">=3.12"
dependencies = [
    "av==12.3.0",
    "numpy==2.1.3",
    "soundfile==0.12.1",
]

[project.scripts]
mediacore = "mediacore.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["mediacore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::DeprecationWarning:mediacore.*",
]
