[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-media"
version = "0.1.0"
description = "Local archival MP4/MOV restoration: timeline repair, segmentation, silence and duplicate detection"
requires-python = ">=3.12"
dependencies = [
    "av>=13,<14",
    "numpy>=2,<3",
    "soundfile>=0.12,<0.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
archive-media = "archive_media.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
