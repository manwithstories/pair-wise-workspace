[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlcore"
version = "0.1.0"
description = "Deterministic short-form timeline inspection and rendering tool"
requires-python = ">=3.11"
dependencies = ["opentimelineio==0.17.0", "pytest==8.2.2"]

[project.scripts]
tlcore = "tlcore.cli:main"

[tool.setuptools.packages.find]
include = ["tlcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
