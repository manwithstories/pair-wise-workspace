[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlrender"
version = "1.0.0"
description = "Offline subtitle timeline resolution and headless first-frame rendering"
requires-python = ">=3.11"
dependencies = [
    "Pillow==10.4.0",
    "numpy==1.26.4",
]

[project.scripts]
tlrender = "tlrender.cli:main"

[tool.setuptools]
packages = ["tlrender"]
