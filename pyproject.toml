[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-timeline"
version = "0.1.0"
description = "Reconstruct a unified media timeline across HLS/DASH edge segments"
requires-python = ">=3.12"
dependencies = [
    "av>=13,<14",
    "numpy>=2,<3",
    "soundfile>=0.12,<0.13",
]

[project.scripts]
relay-timeline = "relay_timeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
