[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relaydiag"
version = "0.1.0"
description = "Regional live relay stream damage diagnosis and checkpointed recovery tool"
requires-python = ">=3.12"
dependencies = [
    "av==12.3.0",
    "numpy==2.1.0",
    "soundfile==0.12.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
relaydiag = "relaydiag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
