[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaprobe"
version = "0.1.0"
description = "Bounded, offline audiovisual delivery validator"
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
mediaprobe = "mediaprobe.cli:main"

[tool.setuptools.packages.find]
include = ["mediaprobe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
