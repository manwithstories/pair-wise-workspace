[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remuxsync"
version = "0.1.0"
description = "Multi-track raw-stream repair, timestamp alignment and index rebuild for remote production ingest"
requires-python = ">=3.12"
dependencies = [
    "av>=13,<14",
    "numpy>=2,<3",
    "soundfile>=0.12,<0.13",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
remuxsync = "remuxsync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
