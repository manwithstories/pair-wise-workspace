[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-batch"
version = "0.1.0"
description = "Batch media segment extraction, silence marking, dedup and remux with checkpointed recovery"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=12,<13",
    "numpy>=2,<3",
    "soundfile>=0.12,<0.13",
]

[project.optional-dependencies]
test = []

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["media_batch"]
