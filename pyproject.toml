[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mkvkit"
version = "0.1.0"
description = "Pure-Python Matroska to MP4 remuxer for court-recording archival"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4"]

[project.optional-dependencies]
test = ["pytest==8.2.0"]

[project.scripts]
mkvkit = "mkvkit.cli:main"

[tool.setuptools.packages.find]
include = ["mkvkit*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
