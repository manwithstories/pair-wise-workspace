[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archive-restore"
version = "0.1.0"
description = "Historical HLS/DASH archive restoration and verification toolkit"
requires-python = ">=3.12"
dependencies = [
    "av==13.1.0",
    "numpy==2.1.3",
    "soundfile==0.12.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
archive-restore = "archive_restore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
