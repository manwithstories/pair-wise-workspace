[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talkmap"
version = "0.1.0"
description = "Streaming speech/silence segmentation for long mono WAV recordings"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "talkmap team" }]
dependencies = ["numpy>=1.26,<2"]

[project.scripts]
talkmap = "talkmap.__main__:main"

[tool.setuptools]
packages = ["talkmap"]
