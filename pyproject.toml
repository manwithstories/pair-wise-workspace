[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediabridge"
version = "0.1.0"
description = "Streaming repair, resumable indexing and verification for broken MP4/MOV archives"
requires-python = ">=3.12"
dependencies = [
    "av==12.3.0",
    "numpy==2.1.3",
    "soundfile==0.12.1",
]

[project.scripts]
mediabridge = "mediabridge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
