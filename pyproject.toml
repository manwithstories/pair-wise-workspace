[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relaymedia"
version = "0.1.0"
description = "Local, resumable segment-relay pipeline for distributed live media edges"
requires-python = ">=3.12"
dependencies = [
    "av>=12,<13",
    "numpy>=2,<3",
    "soundfile>=0.12,<0.13",
]

[project.optional-dependencies]
test = []

[project.scripts]
relaymedia = "relaymedia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relaymedia = ["py.typed"]
