[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlkit"
version = "0.1.0"
description = "Timeline exchange-file toolkit: parse, detect conflicts, resolve, render frame plans"
requires-python = ">=3.11"
dependencies = [
    "opentimelineio==0.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
]

[project.scripts]
tlkit = "tlkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
