[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldindex"
version = "0.1.0"
description = "现场字幕与 SMPTE 时间码修复、分段随机访问索引与证据复核"
requires-python = ">=3.12"
dependencies = [
    "av>=12,<13",
    "numpy>=2.0",
    "soundfile>=0.12,<0.13",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
fieldindex = "fieldindex.cli:main"
live-delivery = "live_delivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
