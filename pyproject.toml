[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mixgraph"
version = "0.1.0"
description = "Deterministic graph mixer for offline rendering and streamed pulls"
requires-python = ">=3.11"
dependencies = [
  "numpy==1.26.*",
  "soundfile==0.12.*",
  "PyYAML==6.0.*",
]

[project.optional-dependencies]
test = ["pytest==8.0.*"]

[tool.setuptools.packages.find]
include = ["mixgraph*", "fixtures*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

