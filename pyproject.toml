[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldpack"
version = "0.1.0"
description = "Multi-camera frame-record demux, mapping and lossless remux delivery tool"
requires-python = ">=3.12"
dependencies = [
    "av>=12,<13",
    "numpy>=2,<3",
    "soundfile>=0.12,<0.13",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
fieldpack = "fieldpack.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
