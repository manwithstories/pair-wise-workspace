[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkvtool"
version = "0.1.0"
description = "Local Matroska inspection and MP4 remux utility"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mkvtool = "mkvtool.cli:main"

[tool.setuptools.packages.find]
include = ["mkvtool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
