[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-taint-scanner"
version = "0.1.0"
description = "Local, non-executing Python static taint scanner"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter==0.23.0",
  "tree-sitter-python==0.23.0",
  "PyYAML==6.0.1",
]

[project.scripts]
taint = "taint.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

