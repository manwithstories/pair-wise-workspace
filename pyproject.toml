[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "region-media"
version = "0.1.0"
description = "跨节点 HLS/DASH 媒体传输质量核验工具"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Region Live Distribution Team" }]
dependencies = [
    "av==12.3.0",
    "numpy==2.1.3",
    "soundfile==0.12.1",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["region_media*"]
