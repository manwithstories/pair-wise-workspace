[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediasync"
version = "0.1.0"
description = "Deterministic multi-track A/V sync, recovery and manifest reporting for raw elementary streams."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "av>=12.0,<13",
    "numpy>=2.0,<3",
    "soundfile>=0.12,<0.13",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10",
]

[project.scripts]
mediasync = "mediasync.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
