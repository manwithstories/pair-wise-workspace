[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-delivery"
version = "0.1.0"
description = "多机位现场音频交付流水线：HLS/DASH 清单统一、分片恢复、响度归一与交付统计"
requires-python = ">=3.12"
dependencies = [
    "av>=12,<13",
    "numpy>=2.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
live-delivery = "live_delivery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
