[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldcut"
version = "0.1.0"
description = "Multi-camera timeline alignment and multi-bitrate segmented delivery for field production"
requires-python = ">=3.12"
dependencies = [
    "av>=12,<14",
    "numpy>=2,<3",
    "soundfile>=0.12,<0.13",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
fieldcut = "fieldcut.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fieldcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
