[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mediarc"
version = "0.1.0"
description = "Local, verifiable archiving pipeline for multi-track production masters"
requires-python = ">=3.12"
dependencies = [
    "av>=13,<14",
    "numpy>=2,<3",
    "soundfile>=0.12,<0.13",
]

[project.optional-dependencies]
test = []

[project.scripts]
mediarc = "mediarc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mediarc = ["py.typed"]
