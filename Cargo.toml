[package]
name = "jmespath-guard"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Statically-typed, deterministic JMESPath-subset query engine for risk-control data pipelines"
license = "MIT"

[dependencies]
serde_json = "1.0"

[dev-dependencies]
criterion = "0.5"

[lib]
name = "jmespath_guard"
path = "src/lib.rs"

[[bench]]
name = "bench"
harness = false
