[package]
name = "secpipe"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Local, replayable, auditable security log pipeline (nginx/sshd/zeek)"
license = "MIT"

[lib]
name = "secpipe"
path = "src/lib.rs"

[[bin]]
name = "secpipe"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
