[package]
name = "cert-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
default-run = "cert-audit"
description = "Financial PKI compliance audit tool for bulk DER-encoded X.509 certificate ingestion"

[dependencies]
rusqlite = { version = "=0.31.0", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[lib]
name = "cert_audit"
path = "src/lib.rs"
