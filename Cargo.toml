[package]
name = "jitter_relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"

[dependencies]
clap = { version = "=4.5.4", features = ["derive"] }
tokio = { version = "=1.38.0", features = ["rt-multi-thread", "net", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hound = "3.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
